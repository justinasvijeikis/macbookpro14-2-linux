# MacBookPro14,2: Apple DSP (filter-chain 60-macbook-speakers) needs 4 channels:
# FL/FR tweeters, RL/RR woofers. Without this WirePlumber may come back in stereo.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = { device.profile = "output:analog-surround-40+input:analog-stereo" } }
  }
]
